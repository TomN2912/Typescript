AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: A minimal TypeScript REST API on AWS

Globals:
  Function:
    Timeout: 5
    MemorySize: 128
    Runtime: nodejs22.x
    Architectures:
      - arm64

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/hello.handler
      Events:
        HelloRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /hello
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/hello.ts
        Minify: true
        Sourcemap: true
        Target: es2022

Outputs:
  ApiUrl:
    Description: URL for the hello endpoint
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/hello"
